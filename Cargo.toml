[workspace]
resolver = "2"
members = [
    "crates/bridge-core",
    "crates/bridge-cli",
    "crates/bridge-gguf",
    "crates/bridge-gguf-split",
    "crates/bridge-model-hy3",
    "crates/bridge-quant-layout",
    "crates/bridge-kernels-reference",
    "crates/bridge-kernels-cpu",
    "crates/bridge-kv-gqa",
    "crates/bridge-test-model",
    "crates/bridge-tokenizer",
    "crates/bridge-runtime",
    "crates/bridge-server",
    "crates/bridge-io-windows",
    "crates/bridge-format",
    "crates/bridge-prepare",
    "crates/bridge-cache",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["LightBridge-LLM ENGINE contributors"]
repository = "https://github.com/lightbridge/LightBridge-Engine"

[workspace.dependencies]
bridge-core = { path = "crates/bridge-core" }
bridge-cli = { path = "crates/bridge-cli" }
bridge-gguf = { path = "crates/bridge-gguf" }
bridge-gguf-split = { path = "crates/bridge-gguf-split" }
bridge-model-hy3 = { path = "crates/bridge-model-hy3" }
bridge-quant-layout = { path = "crates/bridge-quant-layout" }
bridge-kernels-reference = { path = "crates/bridge-kernels-reference" }
bridge-kernels-cpu = { path = "crates/bridge-kernels-cpu" }
bridge-kv-gqa = { path = "crates/bridge-kv-gqa" }
bridge-test-model = { path = "crates/bridge-test-model" }
bridge-tokenizer = { path = "crates/bridge-tokenizer" }
bridge-runtime = { path = "crates/bridge-runtime" }
bridge-server = { path = "crates/bridge-server" }
bridge-io-windows = { path = "crates/bridge-io-windows" }
bridge-format = { path = "crates/bridge-format" }
bridge-prepare = { path = "crates/bridge-prepare" }
bridge-cache = { path = "crates/bridge-cache" }

thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
memmap2 = "0.9"
half = { version = "2", features = ["num-traits"] }
blake3 = "1"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
parking_lot = "0.12"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "signal"] }
tokio-stream = "0.1"
axum = "0.7"
http-body-util = "0.1"
http = "1"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
tower = { version = "0.5", features = ["util"] }
raw-cpuid = "11"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemServices",
] }
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

# Keep dev builds usable for large packed Hy3 decode paths.
[profile.dev.package."*"]
opt-level = 2
